<!-- =====================================================================
     ESP32-C6 BLE GATT Peripheral — ThingsBoard Control Widget
     Native BLE GATT (no AT commands) via Gateway BLE handler
     Service: 0xFFF0 | Char FFF1: READ|NOTIFY (counter) | Char FFF2: WRITE (LED)
     Paste into "HTML" tab | CSS into "CSS" tab | JS into "JavaScript" tab
     ThingsBoard v4.x  —  Modern Control Widget
     ===================================================================== -->

<div id="app-root" class="app-root">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="ble-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 7.5L17.5 17.5M17.5 6.5L6.5 16.5M12 3V21M17.5 6.5L12 12L17.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">BLE Controller</div>
        <div class="app-subtitle">GATT Device</div>
      </div>
    </div>
    <div class="header-status">
      <div class="status-pill" id="status-pill" data-state="idle">
        <div class="status-dot-sm" id="status-dot"></div>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">

    <!-- ── LEFT: Device Scan Panel ── -->
    <div class="panel-devices">
      <div class="panel-devices-header">
        <span class="section-label">Nearby Devices</span>
        <div id="scan-badge" class="scan-badge" data-state="idle">IDLE</div>
      </div>

      <div class="scan-actions">
        <button class="btn-scan" id="btn-scan" onclick="startScan()">
          <span class="btn-scan-icon">⦿</span>
          <span>Scan</span>
        </button>
        <button class="btn-disconnect" id="btn-disconnect" onclick="disconnectDevice()">
          <span>✕ Disconnect</span>
        </button>
      </div>

      <div class="device-count-label">
        Devices <span id="scan-count" class="count-badge">0</span>
      </div>

      <div id="device-list" class="device-list">
        <div class="empty-state">
          <div class="empty-icon">📡</div>
          <div class="empty-msg">Press Scan to find<br>BLE devices</div>
        </div>
      </div>
    </div>

    <!-- ── RIGHT: Control Panel ── -->
    <div class="panel-control">

      <!-- Connected device hero -->
      <div class="device-hero" id="device-hero">
        <div class="hero-icon" id="hero-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <path d="M14 14L26 26M26 13L14 25M20 8V32M26 13L20 20L26 27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-info">
          <div class="hero-name" id="hero-name">Not Connected</div>
          <div class="hero-mac" id="hero-mac">—</div>
        </div>
        <div class="counter-badge" id="counter-badge" title="FFF1 Counter">
          <div class="counter-label">CNT</div>
          <div class="counter-val" id="counter-val">—</div>
        </div>
      </div>

      <!-- ── Controls (hidden by overlay when disconnected) ── -->
      <div class="controls-area" id="controls-area">

        <!-- Power Toggle Row -->
        <div class="control-card">
          <div class="card-header">
            <div class="card-icon-wrap" id="led-icon-wrap" data-on="false">
              <span class="card-icon" id="led-icon">💡</span>
            </div>
            <div class="card-info">
              <div class="card-title">LED Power</div>
              <div class="card-subtitle" id="led-status-text">LED is OFF</div>
            </div>
            <!-- iOS-style toggle -->
            <div class="toggle-wrap">
              <input type="checkbox" id="led-toggle" class="toggle-input" onchange="onLedToggle(this.checked)">
              <label for="led-toggle" class="toggle-label"></label>
            </div>
          </div>
        </div>

        <!-- Color Picker Card -->
        <div class="control-card color-card" id="color-card">
          <div class="color-card-header">
            <span class="card-title">LED Color</span>
            <div class="color-preview-wrap">
              <div class="color-preview" id="color-preview"></div>
              <span class="color-hex-label" id="color-hex-label">#FF8000</span>
            </div>
          </div>

          <!-- Hue gradient strip -->
          <div class="hue-track-wrap">
            <input type="range" id="hue-slider" class="hue-slider" min="0" max="359" value="30"
                   oninput="onHueChange(this.value)" onchange="onHueCommit(this.value)">
          </div>

          <!-- Brightness strip -->
          <div class="bright-row">
            <span class="bright-icon">🌑</span>
            <input type="range" id="bright-slider" class="bright-slider" min="10" max="100" value="80"
                   oninput="onBrightChange(this.value)" onchange="onBrightCommit(this.value)">
            <span class="bright-icon">☀️</span>
          </div>

          <!-- Quick color swatches -->
          <div class="swatches">
            <button class="swatch" data-h="0"   data-b="90"  style="background:#FF1A1A" onclick="applySwatch(0,90)"   title="Red"></button>
            <button class="swatch" data-h="30"  data-b="90"  style="background:#FF8000" onclick="applySwatch(30,90)"  title="Orange"></button>
            <button class="swatch" data-h="60"  data-b="90"  style="background:#FFFF00" onclick="applySwatch(60,90)"  title="Yellow"></button>
            <button class="swatch" data-h="120" data-b="90"  style="background:#00FF00" onclick="applySwatch(120,90)" title="Green"></button>
            <button class="swatch" data-h="180" data-b="85"  style="background:#00CCCC" onclick="applySwatch(180,85)" title="Cyan"></button>
            <button class="swatch" data-h="210" data-b="90"  style="background:#0080FF" onclick="applySwatch(210,90)" title="Blue"></button>
            <button class="swatch" data-h="270" data-b="90"  style="background:#8000FF" onclick="applySwatch(270,90)" title="Violet"></button>
            <button class="swatch" data-h="300" data-b="90"  style="background:#FF00CC" onclick="applySwatch(300,90)" title="Pink"></button>
            <button class="swatch swatch-white"              style="background:#FFFFFF" onclick="applySwatch(-1,100)"  title="White"></button>
          </div>

          <button class="btn-send-color" id="btn-send-color" onclick="sendCurrentColor()">
            <span>Send Color</span>
            <span class="send-arrow">→</span>
          </button>
        </div>

      </div><!-- /controls-area -->

      <!-- Overlay (shown when not connected) -->
      <div id="ctrl-overlay" class="ctrl-overlay">
        <div class="overlay-inner">
          <div id="overlay-spinner" class="spinner hidden"></div>
          <div class="overlay-ble-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="23" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
              <path d="M18 18L30 30M30 17L18 29M24 10V38M30 17L24 24L30 31" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p id="overlay-msg" class="overlay-msg">← Scan &amp; select a<br>device to connect</p>
        </div>
      </div>

    </div><!-- /panel-control -->
  </div><!-- /main-content -->

  <!-- ── Console (always visible at bottom) ── -->
  <div class="console-panel">
    <div class="console-header">
      <div class="console-header-left">
        <div class="console-dot console-dot-green"></div>
        <div class="console-dot console-dot-yellow"></div>
        <div class="console-dot console-dot-red"></div>
        <span class="console-title">Console</span>
      </div>
      <button class="btn-clear-log" onclick="clearLog()" title="Clear">✕</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /app-root -->
