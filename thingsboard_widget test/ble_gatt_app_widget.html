<!-- =====================================================================
     DA2 BLE GATT App Widget — ThingsBoard Control Widget (End-User)
     Protocol: CFML:CFBL:<slot>:<AT_command>
     Target: ESP32-C6 "DA2_TEST_GATT" — GATT Service 0xFFF0
       FFF1 (read/notify) = counter
       FFF2 (write)       = LED GPIO8 (0x00=OFF, 0x01=ON, 0xRRGGBB=color)

     Paste: HTML → "HTML" tab | CSS → "CSS" tab | JS → "JavaScript" tab
     ThingsBoard v4.x — Control widget
     ===================================================================== -->

<div id="app-root" class="app-root">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="ble-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 7.5L17.5 17.5M17.5 6.5L6.5 16.5M12 3V21M17.5 6.5L12 12L17.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">BLE Controller</div>
        <div class="app-subtitle">DA2 GATT Device</div>
      </div>
    </div>
    <div class="header-status">
      <div class="status-pill" id="status-pill" data-state="idle">
        <div class="status-dot-sm" id="status-dot"></div>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">

    <!-- ── LEFT: Device Scan Panel ── -->
    <div class="panel-devices">
      <div class="panel-devices-header">
        <span class="section-label">Nearby Devices</span>
        <div id="scan-badge" class="scan-badge" data-state="idle">IDLE</div>
      </div>

      <div class="scan-actions">
        <button class="btn-scan" id="btn-scan" onclick="startScan()">
          <span class="btn-scan-icon">⦿</span>
          <span>Scan</span>
        </button>
        <button class="btn-disconnect" id="btn-disconnect" onclick="disconnectDevice()">
          <span>✕ Disconnect</span>
        </button>
      </div>

      <div class="device-count-label">
        Devices <span id="scan-count" class="count-badge">0</span>
      </div>

      <div id="device-list" class="device-list">
        <div class="empty-state">
          <div class="empty-icon">📡</div>
          <div class="empty-msg">Press Scan to find<br>BLE devices</div>
        </div>
      </div>
    </div>

    <!-- ── RIGHT: Control Panel ── -->
    <div class="panel-control">

      <!-- Connected device hero -->
      <div class="device-hero" id="device-hero">
        <div class="hero-icon" id="hero-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <path d="M14 14L26 26M26 13L14 25M20 8V32M26 13L20 20L26 27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-info">
          <div class="hero-name" id="hero-name">Not Connected</div>
          <div class="hero-mac" id="hero-mac">—</div>
        </div>
        <div class="counter-badge" id="counter-badge" title="FFF1 Counter">
          <div class="counter-label">CNT</div>
          <div class="counter-val" id="counter-val">—</div>
        </div>
      </div>

      <!-- ── Controls (hidden by overlay when disconnected) ── -->
      <div class="controls-area" id="controls-area">

        <!-- Power Toggle Row -->
        <div class="control-card">
          <div class="card-header">
            <div class="card-icon-wrap" id="led-icon-wrap" data-on="false">
              <span class="card-icon" id="led-icon">💡</span>
            </div>
            <div class="card-info">
              <div class="card-title">LED Power</div>
              <div class="card-subtitle" id="led-status-text">Tap to control</div>
            </div>
            <!-- iOS-style toggle -->
            <div class="toggle-wrap">
              <input type="checkbox" id="led-toggle" class="toggle-input" onchange="onLedToggle(this.checked)">
              <label for="led-toggle" class="toggle-label"></label>
            </div>
          </div>
        </div>

        <!-- Color Control Card -->
        <div class="control-card color-card" id="color-card">
          <div class="color-card-header">
            <span class="card-title">LED Color</span>
            <div class="color-preview-wrap">
              <div class="color-preview" id="color-preview"></div>
              <span class="color-hex-label" id="color-hex-label">—</span>
            </div>
          </div>
          <!-- 5 Fixed Color Buttons -->
          <div class="color-buttons">
            <button class="btn-color btn-color-red"    id="btn-c-red"    onclick="sendFixedColor('FF0000',this)">Đỏ</button>
            <button class="btn-color btn-color-green"  id="btn-c-green"  onclick="sendFixedColor('00FF00',this)">Xanh lá</button>
            <button class="btn-color btn-color-blue"   id="btn-c-blue"   onclick="sendFixedColor('0000FF',this)">Xanh dương</button>
            <button class="btn-color btn-color-yellow" id="btn-c-yellow" onclick="sendFixedColor('FFFF00',this)">Vàng</button>
            <button class="btn-color btn-color-white"  id="btn-c-white"  onclick="sendFixedColor('FFFFFF',this)">Trắng</button>
          </div>
        </div>

      </div><!-- /controls-area -->

      <!-- Overlay (shown when not connected) -->
      <div id="ctrl-overlay" class="ctrl-overlay">
        <div class="overlay-inner">
          <div id="overlay-spinner" class="spinner hidden"></div>
          <div class="overlay-ble-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="23" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
              <path d="M18 18L30 30M30 17L18 29M24 10V38M30 17L24 24L30 31" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p id="overlay-msg" class="overlay-msg">← Scan &amp; select a<br>device to connect</p>
        </div>
      </div>

    </div><!-- /panel-control -->
  </div><!-- /main-content -->

  <!-- ── Console (always visible at bottom) ── -->
  <div class="console-panel">
    <div class="console-header">
      <div class="console-header-left">
        <div class="console-dot console-dot-green"></div>
        <div class="console-dot console-dot-yellow"></div>
        <div class="console-dot console-dot-red"></div>
        <span class="console-title">Console</span>
      </div>
      <button class="btn-clear-log" onclick="clearLog()" title="Clear">✕</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /app-root -->
