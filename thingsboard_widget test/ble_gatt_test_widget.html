<!-- =====================================================================
     DA2 BLE GATT Test Widget — ThingsBoard Control Widget
     Protocol: CFML:CFBL:<slot>:<AT_command>  (CF parsed by MCU WAN)
     Target: ESP32-C6 "DA2_TEST_GATT" — GATT Service 0xFFF0
       FFF1 (read/notify) = counter | FFF2 (write) = LED GPIO8

     Paste into "HTML" tab | CSS into "CSS" tab | JS into "JavaScript" tab
     ThingsBoard v4.x — Control widget
     ===================================================================== -->

<div id="bg-widget" class="bg-root">

  <!-- ── Config Bar ── -->
  <div class="config-bar">
    <div class="cfg-group">
      <label class="cfg-label">Stack</label>
      <select id="cfg-slot" class="cfg-input cfg-select" onchange="onSlotChange(this.value)">
        <option value="0">BLE S1</option>
        <option value="1">BLE S2</option>
      </select>
    </div>
    <div class="cfg-group">
      <label class="cfg-label">FFF1 Hdl</label>
      <input id="cfg-fff1" class="cfg-input" type="text" value="0009"
             placeholder="0009" style="width:44px;" onchange="state.h_fff1=this.value.trim()"/>
    </div>
    <div class="cfg-group">
      <label class="cfg-label">CCCD Hdl</label>
      <input id="cfg-cccd" class="cfg-input" type="text" value="000A"
             placeholder="000A" style="width:44px;" onchange="state.h_cccd=this.value.trim()"/>
    </div>
    <div class="cfg-group">
      <label class="cfg-label">FFF2 Hdl</label>
      <input id="cfg-fff2" class="cfg-input" type="text" value="000C"
             placeholder="000C" style="width:44px;" onchange="state.h_fff2=this.value.trim()"/>
    </div>
    <button class="btn-cfg-action" onclick="startDiscover()" title="Discover services/chars">
      &#128270; Discover
    </button>
  </div>

  <!-- ── Main Layout ── -->
  <div class="main-layout">

    <!-- LEFT: Device Scan Panel -->
    <div class="panel-devices">
      <div class="panel-header">
        <span class="panel-title">BLE Devices</span>
        <div class="scan-badge" id="scan-badge" data-state="idle">IDLE</div>
      </div>

      <div class="scan-controls">
        <button class="btn-scan-action" id="btn-scan" onclick="startScan()">⦿ Scan</button>
        <button class="btn-scan-action btn-disc" id="btn-disc" onclick="disconnectDevice()">✕ Disc</button>
      </div>

      <div class="list-sep">Devices (<span id="scan-count">0</span>)</div>
      <div id="device-list" class="device-list">
        <div class="no-items-msg">Nhấn ⦿ Scan để tìm thiết bị</div>
      </div>
    </div><!-- /panel-devices -->

    <!-- RIGHT: GATT Control Panel -->
    <div class="panel-control">

      <!-- Header: connected device name + status -->
      <div class="ctrl-header">
        <div class="status-dot" id="status-dot" data-state="off"></div>
        <span id="ctrl-dev-name" class="ctrl-title">— Chưa kết nối —</span>
        <span id="ctrl-dev-mac"  class="ctrl-mac"></span>
      </div>

      <!-- Counter tile (FFF1 notify) -->
      <div class="gatt-tile" id="counter-tile">
        <div class="tile-label">FFF1 Counter</div>
        <div class="tile-val"  id="counter-val">—</div>
        <div class="tile-sub"  id="counter-raw">raw: —</div>
      </div>

      <!-- LED tile (FFF2) -->
      <div class="ctrl-section">
        <div class="ctrl-row space-between">
          <span class="ctrl-label">LED (FFF2)</span>
          <span class="ctrl-value" id="led-state-txt">—</span>
        </div>
        <div class="ctrl-row" style="gap:10px; margin-top:8px;">
          <div class="led-icon" id="led-icon">💡</div>
          <button class="btn-led btn-on"  onclick="sendLedOn()">ON</button>
          <button class="btn-led btn-off" onclick="sendLedOff()">OFF</button>
        </div>
      </div>

      <!-- Notify section -->
      <div class="ctrl-section">
        <span class="ctrl-label" style="display:block;margin-bottom:5px;">Notify (CCCD)</span>
        <div class="input-row">
          <button class="btn-action btn-enable" onclick="enableNotify()">▶ Enable</button>
          <button class="btn-action btn-stop"   onclick="disableNotify()">■ Disable</button>
        </div>
      </div>

      <!-- Read characteristic -->
      <div class="ctrl-section">
        <span class="ctrl-label" style="display:block;margin-bottom:5px;">Read Handle</span>
        <div class="input-row">
          <input id="inp-read-hdl"  class="small-input" type="text" placeholder="Handle e.g. 0009"/>
          <button class="btn-action btn-read" onclick="readHandle()">Read</button>
        </div>
        <div class="read-result" id="read-result"></div>
      </div>

      <!-- Write characteristic -->
      <div class="ctrl-section">
        <span class="ctrl-label" style="display:block;margin-bottom:5px;">Write Handle</span>
        <div class="input-row">
          <input id="inp-write-hdl"  class="small-input" type="text" placeholder="Handle" style="width:52px;"/>
          <input id="inp-write-data" class="small-input" type="text" placeholder="Hex data e.g. 01FF"/>
          <button class="btn-action btn-write" onclick="writeHandle()">Write</button>
        </div>
      </div>

      <!-- Discovery results -->
      <div class="ctrl-section">
        <span class="ctrl-label" style="display:block;margin-bottom:5px;">Discovery</span>
        <div id="disc-results" class="disc-log"></div>
      </div>

      <!-- Overlay (shown when not connected) -->
      <div id="ctrl-overlay" class="ctrl-overlay">
        <div class="overlay-inner">
          <div id="overlay-spinner" class="spinner hidden"></div>
          <p id="overlay-msg" class="overlay-msg">← Scan và chọn thiết bị để kết nối</p>
        </div>
      </div>

    </div><!-- /panel-control -->
  </div><!-- /main-layout -->

  <!-- ── Console ── -->
  <div class="console-panel">
    <div class="console-header">
      <span>Console</span>
      <button class="btn-clear-log" onclick="clearLog()">&#10005;</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /bg-widget -->
