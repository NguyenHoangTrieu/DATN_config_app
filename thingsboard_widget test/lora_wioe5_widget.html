<!-- =====================================================================
     DA2 LoRa Wio-E5 P2P Control Widget — ThingsBoard HTML
     Protocol: CFML:CFLR:<slot>:<MODULE_FUNCTION>[:<params>]  hex-encoded
     Response: CFLR:<slot>:OK:<resp> | CFLR:<slot>:FAIL:<err>:<resp>
     Async:    CFLR:<slot>:EVT:+TEST: RXLRPKT ...  via ThingsBoard telemetry key "data"

     Target module : Seeed Wio-E5 in TEST (P2P LoRa) mode
     Gateway stack : CFLR slot 0 (default, user-selectable)

     Paste: HTML → "HTML" tab | CSS → "CSS" tab | JS → "JavaScript" tab
     ThingsBoard v4.x — Control widget
     ===================================================================== -->

<div id="lr-app-root" class="lr-app-root">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="lr-logo">
        <!-- LoRa radio-wave icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12.5C5 9.46 7.46 7 10.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 12.5C3 8.36 6.36 5 10.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M1 12.5C1 7.25 5.25 3 10.5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="11" cy="13" r="2" fill="currentColor"/>
          <path d="M13 13H22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M19 10L22 13L19 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">LoRa Wio-E5 P2P</div>
        <div class="app-subtitle">Wio-E5 — Point-to-Point TEST Mode</div>
      </div>
    </div>
    <div class="header-right">
      <select id="cfg-slot" class="slot-select" onchange="onSlotChange(this.value)">
        <option value="0">Stack 1</option>
        <option value="1">Stack 2</option>
      </select>
      <div class="status-pill" id="status-pill" data-state="offline">
        <div class="status-dot-sm"></div>
        <span id="status-text">Idle</span>
      </div>
      <button class="btn-info" id="btn-info" onclick="queryModuleInfo()" title="Read module info">ℹ</button>
    </div>
  </div>

  <!-- ── Main Content: 2-column ── -->
  <div class="main-content">

    <!-- ── LEFT: Config + Keys Panel ── -->
    <div class="panel-left">

      <!-- ── P2P Configuration ── -->
      <div class="section-hdr">P2P Configuration</div>
      <div class="keys-panel">
        <label class="inp-label">Frequency (MHz)</label>
        <input id="inp-p2p-freq" class="lr-input" type="text" value="868"
               placeholder="e.g. 868" style="font-family:monospace">

        <label class="inp-label">Spreading Factor (SF)</label>
        <select id="inp-p2p-sf" class="lr-select">
          <option value="SF7" selected>SF7</option>
          <option value="SF8">SF8</option>
          <option value="SF9">SF9</option>
          <option value="SF10">SF10</option>
          <option value="SF11">SF11</option>
          <option value="SF12">SF12</option>
        </select>

        <label class="inp-label">Bandwidth (BW kHz)</label>
        <select id="inp-p2p-bw" class="lr-select">
          <option value="125">125 kHz</option>
          <option value="250">250 kHz</option>
          <option value="500">500 kHz</option>
        </select>

        <label class="inp-label">TX Power (dBm)</label>
        <input id="inp-p2p-txp" class="lr-input" type="number" min="1" max="22" value="14"
               style="font-family:monospace">

        <label class="inp-label">TX Preamble / RX Preamble</label>
        <div class="inp-row">
          <input id="inp-p2p-txpr" class="lr-input" type="number" min="2" max="65535" value="12"
                 placeholder="TXPR" style="font-family:monospace">
          <input id="inp-p2p-rxpr" class="lr-input" type="number" min="2" max="65535" value="15"
                 placeholder="RXPR" style="font-family:monospace">
        </div>

        <div class="key-actions" style="gap:6px; justify-content:space-between">
          <button class="btn-set-keys" onclick="p2pEnterMode()">⚙ Enter TEST Mode</button>
          <button class="btn-set-keys" onclick="p2pSetConfig()">💾 Apply RF Config</button>
        </div>
      </div>

      <!-- RX / Listen controls -->
      <div class="section-hdr" style="margin-top:8px">Receiver</div>
      <div class="join-row">
        <button class="btn-join" id="btn-rx" onclick="p2pStartRx()">
          <span id="rx-btn-text">📡 Start RX</span>
        </button>
        <button class="btn-leave" onclick="p2pStopRx()">■ Stop</button>
      </div>

    </div><!-- /panel-left -->

    <!-- ── RIGHT: TX + RX + Module Info ── -->
    <div class="panel-right">

      <!-- TX Panel -->
      <div class="section-hdr">
        <span>📤 Send P2P Packet</span>
      </div>
      <div class="tx-panel">
        <label class="inp-label">Payload (text or hex, prefix 0x for hex)</label>
        <textarea id="inp-payload" class="lr-textarea"
                  placeholder="Hello P2P&#10;or: 0xDEADBEEF"></textarea>
        <div class="tx-actions">
          <button class="btn-send" id="btn-send" onclick="sendP2P()">
            <span id="send-btn-text">▶ Send TXLRPKT</span>
          </button>
          <span id="tx-status" class="tx-status"></span>
        </div>
      </div>

      <!-- Module Info Panel -->
      <div class="section-hdr" style="margin-top:10px">Module Info</div>
      <div class="info-panel" id="info-panel">
        <div class="info-row"><span class="info-key">Firmware</span><span id="inf-fw" class="info-val">—</span></div>
        <div class="info-row"><span class="info-key">Mode</span><span id="inf-njs" class="info-val">—</span></div>
        <div class="info-row"><span class="info-key">RF Config</span><span id="inf-deveui" class="info-val">—</span></div>
      </div>

    </div><!-- /panel-right -->

  </div><!-- /main-content -->

  <!-- ── Console ── -->
  <div class="console-wrap">
    <div class="console-bar">
      <div class="console-dots">
        <span class="cdot cdot-g"></span>
        <span class="cdot cdot-y"></span>
        <span class="cdot cdot-r"></span>
        <span class="console-title">CONSOLE</span>
      </div>
      <button class="btn-clear" onclick="clearLog()">Clear</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /lr-app-root -->
