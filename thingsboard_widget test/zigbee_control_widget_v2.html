<!-- =====================================================================
     DA2 Zigbee Gateway Control — ThingsBoard Widget HTML v2
     Protocol: CFML:CFZB:<slot>:<function_name>[:<params>]
     Routing: CF → WAN MCU → ML → CFZB Zigbee handler → AT+ZCL= etc.

     Paste: HTML → "HTML" tab | CSS → "CSS" tab | JS → "JavaScript" tab
     ThingsBoard v4.x — Control widget
     ===================================================================== -->

<div id="zb-app-root" class="zb-app-root">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="zb-logo">
        <!-- Zigbee-style hexagonal network icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 9L15 9M9 12L15 12M9 15L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">Zigbee Controller</div>
        <div class="app-subtitle">DA2 ZCL Gateway</div>
      </div>
    </div>
    <div class="header-right">
      <select id="cfg-slot" class="slot-select" onchange="onSlotChange(this.value)">
        <option value="0">Stack 1</option>
        <option value="1">Stack 2</option>
      </select>
      <div class="status-pill" id="status-pill" data-state="off">
        <div class="status-dot-sm"></div>
        <span id="status-text">OFF</span>
      </div>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">

    <!-- ── LEFT: Network & Nodes Panel ── -->
    <div class="panel-devices">
      <div class="panel-devices-header">
        <span class="section-label">Network &amp; Nodes</span>
        <div class="net-badge" id="net-badge" data-state="off">OFF</div>
      </div>

      <!-- Network controls -->
      <div class="net-actions">
        <div class="net-row">
          <button class="btn-net btn-start" onclick="startNetwork()">▶ Start</button>
          <button class="btn-net btn-stop"  onclick="stopNetwork()">■ Stop</button>
        </div>
        <div class="net-row">
          <button class="btn-net btn-join" onclick="openPermitJoin()">⚡ Join</button>
          <button class="btn-net btn-find" onclick="autoFind()">⊕ Find</button>
        </div>
      </div>

      <!-- Network info bar -->
      <div class="net-info-bar" id="net-info-bar">—</div>

      <!-- Node count -->
      <div class="node-count-label">
        Nodes <span id="node-count" class="count-badge">0</span>
      </div>

      <!-- Scrollable node list -->
      <div id="node-list" class="node-list">
        <div class="empty-state">
          <div class="empty-icon">🔶</div>
          <div class="empty-msg">Start network &amp;<br>open Permit Join</div>
        </div>
      </div>
    </div><!-- /panel-devices -->

    <!-- ── RIGHT: ZCL Control Panel ── -->
    <div class="panel-control">

      <!-- Node Hero (selected node info) -->
      <div class="node-hero" id="node-hero">
        <div class="hero-icon" id="hero-icon">🔶</div>
        <div class="hero-info">
          <div class="hero-name" id="hero-name">— Select a node —</div>
          <div class="hero-sub"  id="hero-sub">—</div>
        </div>
        <div class="hero-ep-badge">
          <div class="hero-ep-label">EP</div>
          <div class="hero-ep-val" id="hero-ep-val">—</div>
        </div>
        <button class="btn-del-node hidden" id="btn-del-node" onclick="deleteNode()" title="Remove node">✕</button>
      </div>

      <!-- Cluster Tab Buttons -->
      <div class="cluster-tabs" id="cluster-tabs">
        <button class="btn-cluster-tab active" data-cluster="0006" onclick="selectCluster('0006')">💡 On/Off</button>
        <button class="btn-cluster-tab"        data-cluster="0008" onclick="selectCluster('0008')">🔆 Level</button>
        <button class="btn-cluster-tab"        data-cluster="0300" onclick="selectCluster('0300')">🎨 Color</button>
        <button class="btn-cluster-tab"        data-cluster="0402" onclick="selectCluster('0402')">🌡 Temp</button>
      </div>

      <!-- On/Off section (cluster 0006) -->
      <div class="control-card" id="section-onoff">
        <div class="card-header">
          <div class="card-icon-wrap" id="onoff-icon-wrap" data-on="false">
            <span id="onoff-icon">💡</span>
          </div>
          <div class="card-info">
            <div class="card-title">On / Off</div>
            <div class="card-subtitle" id="onoff-status-text">—</div>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="onoff-toggle" class="toggle-input" onchange="onOnOffToggle(this.checked)">
            <label for="onoff-toggle" class="toggle-label"></label>
          </div>
        </div>
      </div>

      <!-- Level section (cluster 0008) -->
      <div class="control-card level-card hidden" id="section-level">
        <div class="level-header">
          <span class="card-title">Brightness Level</span>
          <span class="level-val-display" id="level-val">50%</span>
        </div>
        <input type="range" id="level-slider" class="level-slider" min="0" max="254" value="127"
               oninput="onLevelInput(this.value)"
               onchange="onLevelChange(this.value)">
      </div>

      <!-- Color section (cluster 0300) -->
      <div class="control-card color-card hidden" id="section-color">
        <div class="color-card-header">
          <span class="card-title">LED Color</span>
          <div class="color-preview-wrap">
            <div class="color-preview" id="color-preview"></div>
            <span class="color-hex-label" id="color-hex-label">#FF8000</span>
          </div>
        </div>

        <!-- Hue strip -->
        <div class="hue-track-wrap">
          <input type="range" id="hue-slider" class="hue-slider" min="0" max="359" value="30"
                 oninput="onHueChange(this.value)" onchange="onHueCommit(this.value)">
        </div>

        <!-- Brightness strip -->
        <div class="bright-row">
          <span class="bright-icon">🌑</span>
          <input type="range" id="bright-slider" class="bright-slider" min="10" max="100" value="80"
                 oninput="onBrightChange(this.value)" onchange="onBrightCommit(this.value)">
          <span class="bright-icon">☀️</span>
        </div>

        <!-- Quick color swatches -->
        <div class="swatches">
          <button class="swatch" data-h="0"   data-b="90"  style="background:#FF1A1A" onclick="applySwatch(0,90)"   title="Red"></button>
          <button class="swatch" data-h="30"  data-b="90"  style="background:#FF8000" onclick="applySwatch(30,90)"  title="Orange"></button>
          <button class="swatch" data-h="60"  data-b="90"  style="background:#FFFF00" onclick="applySwatch(60,90)"  title="Yellow"></button>
          <button class="swatch" data-h="120" data-b="90"  style="background:#00FF00" onclick="applySwatch(120,90)" title="Green"></button>
          <button class="swatch" data-h="180" data-b="85"  style="background:#00CCCC" onclick="applySwatch(180,85)" title="Cyan"></button>
          <button class="swatch" data-h="210" data-b="90"  style="background:#0080FF" onclick="applySwatch(210,90)" title="Blue"></button>
          <button class="swatch" data-h="270" data-b="90"  style="background:#8000FF" onclick="applySwatch(270,90)" title="Violet"></button>
          <button class="swatch" data-h="300" data-b="90"  style="background:#FF00CC" onclick="applySwatch(300,90)" title="Pink"></button>
          <button class="swatch swatch-white"              style="background:#FFFFFF"  onclick="applySwatch(-1,100)" title="White"></button>
        </div>

        <button class="btn-send-color" onclick="sendCurrentColor()">
          <span>Send Color →</span>
          <span class="send-arrow">🎨</span>
        </button>
      </div>

      <!-- Temperature section (cluster 0402) -->
      <div class="control-card sensor-card hidden" id="section-temp">
        <div class="sensor-row">
          <span class="card-title">Temperature</span>
          <button class="btn-adv" onclick="readTempAttr()">↻ Read</button>
        </div>
        <div class="sensor-value-large"><span id="temp-val">—</span><span class="sensor-unit"> °C</span></div>
      </div>

      <!-- Advanced ZCL operations -->
      <div class="adv-section">
        <div class="adv-title">Advanced ZCL</div>
        <div class="adv-row">
          <input id="inp-attr-id" class="adv-input" type="text" placeholder="Attr ID (e.g. 0000)" maxlength="4" />
          <button class="btn-adv" onclick="readAttribute()">Read</button>
          <span class="adv-result" id="attr-read-result">—</span>
        </div>
        <div class="adv-row">
          <input id="inp-write-val" class="adv-input" type="text" placeholder="AttrID,Type,Value" />
          <button class="btn-adv" onclick="writeAttribute()">Write</button>
        </div>
        <div class="adv-row">
          <input id="inp-zcl-cmd" class="adv-input" type="text" placeholder="CmdID[,data…]" />
          <button class="btn-adv btn-adv-send" onclick="sendZclCmd()">→ Cmd</button>
        </div>
      </div>

      <!-- Overlay (shown when no node selected) -->
      <div id="ctrl-overlay" class="ctrl-overlay">
        <div class="overlay-inner">
          <div id="overlay-spinner" class="spinner hidden"></div>
          <div class="overlay-zb-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-linejoin="round"/>
              <path d="M16 18H32M16 24H32M16 30H32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
            </svg>
          </div>
          <p id="overlay-msg" class="overlay-msg">← Start network &amp;<br>select a node</p>
        </div>
      </div>

    </div><!-- /panel-control -->
  </div><!-- /main-content -->

  <!-- ── Console ── -->
  <div class="console-panel">
    <div class="console-header">
      <div class="console-header-left">
        <div class="console-dot console-dot-green"></div>
        <div class="console-dot console-dot-yellow"></div>
        <div class="console-dot console-dot-red"></div>
        <span class="console-title">Console</span>
      </div>
      <button class="btn-clear-log" onclick="clearLog()" title="Clear">✕</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /zb-app-root -->
