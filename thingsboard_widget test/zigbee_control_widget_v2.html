<!-- =====================================================================
     DA2 Zigbee Gateway Control — ThingsBoard Widget HTML v2
     Protocol: CFML:CFZB:<slot>:<function_name>[:<params>]
     Routing: CF → WAN MCU → ML → CFZB Zigbee handler → AT+ZCL= etc.

     Paste: HTML → "HTML" tab | CSS → "CSS" tab | JS → "JavaScript" tab
     ThingsBoard v4.x — Control widget
     ===================================================================== -->

<div id="zb-app-root" class="zb-app-root">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="zb-logo">
        <!-- Zigbee-style hexagonal network icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 9L15 9M9 12L15 12M9 15L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">Zigbee Controller</div>
        <div class="app-subtitle">E180-ZG120B · DA2 Gateway</div>
      </div>
    </div>
    <div class="header-right">
      <select id="cfg-slot" class="slot-select" onchange="onSlotChange(this.value)">
        <option value="0">Stack 1</option>
        <option value="1">Stack 2</option>
      </select>
      <div class="status-pill" id="status-pill" data-state="off">
        <div class="status-dot-sm"></div>
        <span id="status-text">OFF</span>
      </div>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content">

    <!-- ── LEFT: Network & Nodes Panel ── -->
    <div class="panel-devices">
      <div class="panel-devices-header">
        <span class="section-label">Network &amp; Nodes</span>
        <div class="net-badge" id="net-badge" data-state="off">OFF</div>
      </div>

      <!-- Network action chips -->
      <div class="action-grid">
        <button class="chip chip-start" onclick="startNetwork()">
          <span class="chip-icon">▶</span><span>Start</span>
        </button>
        <button class="chip chip-stop" onclick="stopNetwork()">
          <span class="chip-icon">■</span><span>Stop</span>
        </button>
        <button class="chip chip-join" onclick="openPermitJoin()">
          <span class="chip-icon">⚡</span><span>Permit Join</span>
        </button>
        <button class="chip chip-find" onclick="autoFind()">
          <span class="chip-icon">⊕</span><span>Find</span>
        </button>
      </div>

      <!-- Reset state button — full width, clearly visible -->
      <button class="btn-reset-state" onclick="resetState()" title="Clear all nodes and network state">
        ↺ Reset State
      </button>

      <!-- Network info bar -->
      <div class="net-info-bar" id="net-info-bar">—</div>

      <!-- Node count -->
      <div class="node-list-header">
        <span class="section-label">Nodes</span>
        <span id="node-count" class="count-badge">0</span>
      </div>

      <!-- Scrollable node list -->
      <div id="node-list" class="node-list">
        <div class="empty-state">
          <div class="empty-icon">🔶</div>
          <div class="empty-msg">Start network &amp;<br>open Permit Join</div>
        </div>
      </div>
    </div><!-- /panel-devices -->

    <!-- ── RIGHT: ZCL Control Panel ── -->
    <div class="panel-control">

      <!-- Node Hero (selected node info) -->
      <div class="node-hero" id="node-hero">
        <div class="hero-icon" id="hero-icon">🔶</div>
        <div class="hero-info">
          <div class="hero-name" id="hero-name">— Select a node —</div>
          <div class="hero-sub"  id="hero-sub">—</div>
        </div>
        <div class="hero-ep-badge">
          <div class="hero-ep-label">EP</div>
          <div class="hero-ep-val" id="hero-ep-val">—</div>
        </div>
        <button class="btn-del-node hidden" id="btn-del-node" onclick="kickNode()" title="Kick node from network">Kick</button>
      </div>

      <!-- Cluster Tab Buttons -->
      <div class="cluster-tabs" id="cluster-tabs">
        <button class="btn-cluster-tab active" data-cluster="0006" onclick="selectCluster('0006')">💡 On/Off</button>
        <button class="btn-cluster-tab"        data-cluster="0300" onclick="selectCluster('0300')">🎨 Color</button>
      </div>

      <!-- On/Off section (cluster 0006) -->
      <div class="control-card" id="section-onoff">
        <div class="card-header">
          <div class="card-icon-wrap" id="onoff-icon-wrap" data-on="false">
            <span id="onoff-icon">💡</span>
          </div>
          <div class="card-info">
            <div class="card-title">On / Off</div>
            <div class="card-subtitle" id="onoff-status-text">—</div>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="onoff-toggle" class="toggle-input" onchange="onOnOffToggle(this.checked)">
            <label for="onoff-toggle" class="toggle-label"></label>
          </div>
        </div>
      </div>

      <!-- Color section (cluster 0300) -->
      <div class="control-card color-card hidden" id="section-color">
        <div class="color-card-header">
          <span class="card-title">LED Color</span>
          <div class="color-preview-wrap">
            <div class="color-preview" id="color-preview"></div>
            <span class="color-hex-label" id="color-hex-label">—</span>
          </div>
        </div>
        <!-- 5 Fixed Color Buttons -->
        <div class="color-buttons">
          <button class="btn-color btn-color-red"    onclick="sendFixedColor('FF0000',this)">🔴 Đỏ</button>
          <button class="btn-color btn-color-green"  onclick="sendFixedColor('00FF00',this)">🟢 Xanh lá</button>
          <button class="btn-color btn-color-blue"   onclick="sendFixedColor('0000FF',this)">🔵 Xanh dương</button>
          <button class="btn-color btn-color-yellow" onclick="sendFixedColor('FFFF00',this)">🟡 Vàng</button>
          <button class="btn-color btn-color-white"  onclick="sendFixedColor('FFFFFF',this)">⚪ Trắng</button>
        </div>
      </div>

      <!-- Advanced ZCL operations -->
      <div class="adv-section">
        <div class="adv-title">Advanced ZCL</div>
        <div class="adv-row">
          <input id="inp-attr-id" class="adv-input" type="text" placeholder="Attr ID (e.g. 0000)" maxlength="4" />
          <button class="btn-adv" onclick="readAttribute()">Read</button>
          <span class="adv-result" id="attr-read-result">—</span>
        </div>
        <div class="adv-row">
          <input id="inp-write-val" class="adv-input" type="text" placeholder="AttrID,Type,Value" />
          <button class="btn-adv" onclick="writeAttribute()">Write</button>
        </div>
        <div class="adv-row">
          <input id="inp-zcl-cmd" class="adv-input" type="text" placeholder="CmdID[,data…]" />
          <button class="btn-adv btn-adv-send" onclick="sendZclCmd()">→ Cmd</button>
        </div>        <div class="adv-row">
          <button class="btn-adv" onclick="getDeviceName()" style="flex:1">🏷 Get Device Name</button>
          <span class="adv-result" id="device-name-result">—</span>
        </div>      </div>

      <!-- Overlay (shown when no node selected) -->
      <div id="ctrl-overlay" class="ctrl-overlay">
        <div class="overlay-inner">
          <div id="overlay-spinner" class="spinner hidden"></div>
          <div class="overlay-zb-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-linejoin="round"/>
              <path d="M16 18H32M16 24H32M16 30H32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
            </svg>
          </div>
          <p id="overlay-msg" class="overlay-msg">← Start network &amp;<br>select a node</p>
        </div>
      </div>

      <!-- Verifying overlay (shown while auth handshake is in progress) -->
      <div id="verify-overlay" class="ctrl-overlay hidden">
        <div class="overlay-inner">
          <div class="spinner"></div>
          <p class="overlay-msg">🔐 Verifying device…<br><span style="font-size:9px;opacity:0.6">Reading auth key from Basic Cluster</span></p>
        </div>
      </div>

    </div><!-- /panel-control -->
  </div><!-- /main-content -->

  <!-- ── Console ── -->
  <div class="console-panel">
    <div class="console-header">
      <div class="console-header-left">
        <div class="console-dot console-dot-green"></div>
        <div class="console-dot console-dot-yellow"></div>
        <div class="console-dot console-dot-red"></div>
        <span class="console-title">Console</span>
      </div>
      <button class="btn-clear-log" onclick="clearLog()" title="Clear">✕</button>
    </div>
    <div id="console-log" class="console-log"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

</div><!-- /zb-app-root -->
